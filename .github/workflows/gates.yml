name: gates

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: kleos-gate tests
        run: cargo test --manifest-path hooks/kleos-gate/Cargo.toml
      - name: Release binary
        run: |
          cargo build --release --manifest-path hooks/kleos-gate/Cargo.toml
          mkdir -p hooks/bin
          cp -f hooks/kleos-gate/target/release/kleos-gate hooks/bin/kleos-gate
          chmod +x hooks/bin/kleos-gate
      - name: Verify sync
        run: hooks/bin/kleos-gate verify
      - name: Gate diff (prose scan)
        run: hooks/bin/kleos-gate gate-diff
      - name: Hook bench
        run: hooks/bin/kleos-gate bench
