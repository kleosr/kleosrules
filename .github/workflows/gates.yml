name: gates

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gauntlet
        run: KLEOS_STATE_DIR=$(mktemp -d) python3 hooks/_gauntlet.py
      - name: Hook contracts
        run: python3 hooks/_verify_hook_contracts.py
      - name: Proof evals
        run: python3 hooks/_proof_evals.py
      - name: Selftest
        run: python3 hooks/_selftest.py
      - name: Gate diff
        run: python3 scripts/gate-diff.py
